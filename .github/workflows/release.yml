name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.0.0). Leave empty to use the version in the project file.'
        required: false
        type: string

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=""
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION:-<project default>}"

      - name: Restore
        run: dotnet restore LiveMarkdown.Avalonia.DrawIo.csproj

      - name: Build
        run: >
          dotnet build LiveMarkdown.Avalonia.DrawIo.csproj
          -c Release
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Pack
        shell: bash
        run: |
          if [ -n "${{ steps.version.outputs.version }}" ]; then
            dotnet pack LiveMarkdown.Avalonia.DrawIo.csproj \
              -c Release \
              --no-build \
              -o artifacts \
              -p:PackageVersion="${{ steps.version.outputs.version }}"
          else
            dotnet pack LiveMarkdown.Avalonia.DrawIo.csproj \
              -c Release \
              --no-build \
              -o artifacts
          fi

      - name: Push to NuGet.org
        if: env.NUGET_API_KEY != ''
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: artifacts/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
