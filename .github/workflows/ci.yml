name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore LiveMarkdown.Avalonia.DrawIo.csproj

      - name: Build
        run: >
          dotnet build LiveMarkdown.Avalonia.DrawIo.csproj
          -c Release
          --no-restore
          -warnaserror

      - name: Pack (validation)
        run: dotnet pack LiveMarkdown.Avalonia.DrawIo.csproj -c Release --no-build -o artifacts
